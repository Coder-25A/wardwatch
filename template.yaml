AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  WardWatch - monsoon and civic issue reporter for one city ward.
  Residents report flooded drains, potholes, garbage and broken streetlights.
  Free-tier friendly: Lambda (arm64), API Gateway REST API, DynamoDB on-demand.

# ---------------------------------------------------------------------------
# Settings shared by every Lambda function below.
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64            # Graviton: cheaper per ms than x86
    MemorySize: 128      # smallest size, plenty for this app
    Timeout: 10
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !Ref ReportsTable
        WARD_NAME: !Ref WardName

Parameters:
  WardName:
    Type: String
    Default: "Ward 12"
    Description: Display name of the ward this deployment serves.

Resources:
  # -------------------------------------------------------------------------
  # Data: one DynamoDB table holding every report.
  # -------------------------------------------------------------------------
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST          # on-demand: pay only per request, nothing when idle
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true                    # encryption at rest with the AWS managed KMS key
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false   # off on purpose: PITR is billed per GB-month
      Tags:
        - Key: project
          Value: wardwatch

  # -------------------------------------------------------------------------
  # API: a REST API. NOTE: no throttling is configured here on purpose.
  # This is the "before" state. See FIX.md for the "after" change.
  # -------------------------------------------------------------------------
  WardWatchApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"

  # -------------------------------------------------------------------------
  # Log groups with a 7 day retention, so logs never pile up forever.
  # -------------------------------------------------------------------------
  CreateReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-create-report"
      RetentionInDays: 7

  ListReportsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-list-reports"
      RetentionInDays: 7

  # -------------------------------------------------------------------------
  # POST /reports : a resident submits a new report.
  # Permission: write-only on this one table (least privilege).
  # -------------------------------------------------------------------------
  CreateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: create_report.handler
      Description: Validate and store a new ward report
      LoggingConfig:
        LogFormat: JSON                 # structured logs
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: !Ref CreateReportLogGroup
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ReportsTable
      Events:
        CreateReport:
          Type: Api
          Properties:
            RestApiId: !Ref WardWatchApi
            Path: /reports
            Method: post

  # -------------------------------------------------------------------------
  # GET /reports : anyone can view the list. Public and unauthenticated.
  # Uses a table Scan with pagination. Permission: read-only on this table.
  # -------------------------------------------------------------------------
  ListReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: list_reports.handler
      Description: Return a page of ward reports (table Scan)
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: !Ref ListReportsLogGroup
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReportsTable
      Events:
        ListReports:
          Type: Api
          Properties:
            RestApiId: !Ref WardWatchApi
            Path: /reports
            Method: get

Outputs:
  ApiUrl:
    Description: Base URL of the WardWatch API (add "reports" to the end)
    Value: !Sub "https://${WardWatchApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  ReportsEndpoint:
    Description: Full URL for GET and POST /reports
    Value: !Sub "https://${WardWatchApi}.execute-api.${AWS::Region}.amazonaws.com/prod/reports"
  ReportsTableName:
    Description: DynamoDB table that stores reports
    Value: !Ref ReportsTable
